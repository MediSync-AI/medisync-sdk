[project]
name = "medisync"
version = "0.2.0"
description = "Python SDK for the MediSync API: speech, notes, ICD-10-GM coding, decisions and MediSync Connect"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "MediSync GmbH", email = "support@medisync.me" }]
keywords = ["medisync", "speech-to-text", "clinical-notes", "icd-10-gm", "pvs", "kis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.5,<3",
  "typing-extensions>=4.7",
  "websockets>=13,<17",
]

[project.optional-dependencies]
# Signing the client assertion of a MediSync Connect app (ES256 or EdDSA).
app = ["cryptography>=42"]

[project.urls]
Documentation = "https://docs.medisync.me"
Repository = "https://github.com/MediSync-AI/medisync-sdk"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medisync"]

[tool.hatch.build.targets.sdist]
include = ["src/medisync", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.13",
  "pyright>=1.1.390",
  "ruff>=0.8",
  "cryptography>=42",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
# mypy no longer checks for a 3.9 target; pyright does (pythonVersion below), and the tests run on 3.9.
python_version = "3.10"
files = ["src/medisync"]

[tool.pyright]
include = ["src/medisync"]
pythonVersion = "3.9"
typeCheckingMode = "strict"
reportPrivateUsage = false
reportUnnecessaryIsInstance = false
reportMissingTypeStubs = false

[tool.ruff]
line-length = 140
target-version = "py39"
extend-exclude = ["src/medisync/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045", "E501"]
