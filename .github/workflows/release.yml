# One release of every package from one tag v<version>: TypeScript to npm and JSR, Python to
# PyPI, Java to Maven Central, .NET to NuGet, then a GitHub release with the files.
#
# Release:
#   1. bun scripts/version.ts set 0.2.0, then a pull request into dev.
#   2. After the merge: git tag v0.2.0 <merge commit> && git push origin v0.2.0 (admins only).
#   3. In the run, click "Review deployments", select every environment, approve once.
#
# Rehearsal: Actions > Release > Run workflow on dev. It runs every check and build, then every
# publish job without publishing: npm and JSR with --dry-run, the PyPI files checked, a Maven
# Central upload that is validated and then dropped, and the NuGet trusted-publishing login
# without a push.
#
# Each package is built and checked once; the publish jobs send exactly the files that passed the
# tests and the leak check. Registries trust this file by name (npm, PyPI, NuGet) and by
# environment: do not rename it or the environments.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.0
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # A pushed tag publishes. A manual run is a rehearsal.
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      python: ${{ steps.v.outputs.python }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: One version in every package, equal to the tag
        id: v
        run: |
          bun scripts/version.ts --github >> "$GITHUB_OUTPUT"
          version="$(bun scripts/version.ts)"
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME, packages $version: push the tag v$version." >&2
            exit 1
          fi
          echo "Version $version (publish: $PUBLISH)"
      - run: bun install --frozen-lockfile
      - name: Specs match SOURCE.json, generated code is up to date
        run: bun run specs:check && bun run generate:check
      - name: Contract and name list of MediSync Connect (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: MediSync-AI/medisync-connect
          ref: dev
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          path: .connect-ref
          fetch-depth: 1
          sparse-checkout: |
            /api/openapi.yaml
            /release/public-names.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Leak check of the repository (JSR publishes the sources)
        env:
          CONNECT_REPO: ${{ github.workspace }}/.connect-ref
          CONNECT_REF: HEAD
        run: bun release/leak-check.ts --repo

  typescript:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - run: npm run lint
      - name: Unit and parity tests
        run: npm test
      - name: Conformance
        run: npm run conformance
      - run: npm run build
      - run: npm run check:package
      - name: Pack once
        run: mkdir -p ../out && npm pack --pack-destination ../out
      - name: JSR accepts the package
        run: npx --yes jsr publish --dry-run
      - uses: ./.github/actions/leak-check
        with:
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          files: out/medisync-${{ needs.version.outputs.version }}.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: out/medisync-${{ needs.version.outputs.version }}.tgz
          if-no-files-found: error

  python:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Unit, parity and conformance tests on Python 3.9 and 3.13
        run: |
          for py in 3.9 3.13; do
            uv run --python "$py" --isolated --no-dev --with pytest --with pytest-asyncio --with cryptography pytest -q
          done
      - name: Lint and types
        run: |
          uv sync --python 3.13 --locked
          uv run ruff check src tests
          uv run mypy
          uv run pyright
      - name: Build once
        run: uv build --out-dir ../dist
      - run: python3 scripts/check_dist.py ../dist
      - name: PyPI accepts the metadata
        run: uvx twine check --strict ../dist/*
      - uses: ./.github/actions/leak-check
        with:
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          files: dist/medisync-${{ needs.version.outputs.python }}-py3-none-any.whl dist/medisync-${{ needs.version.outputs.python }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  java:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '21']
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Compile with -Werror, javadoc lint, unit, parity and conformance tests, jars
        run: ./mvnw -B -ntp verify

  dotnet:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build with warnings as errors, unit, parity and conformance tests
        run: dotnet test tests/MediSync.Tests -c Release
      - name: Pack once
        run: dotnet pack src/MediSync -c Release -o ../dist/dotnet
      - uses: ./.github/actions/leak-check
        with:
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          files: dist/dotnet/MediSync.${{ needs.version.outputs.version }}.nupkg dist/dotnet/MediSync.${{ needs.version.outputs.version }}.snupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            dist/dotnet/MediSync.${{ needs.version.outputs.version }}.nupkg
            dist/dotnet/MediSync.${{ needs.version.outputs.version }}.snupkg
          if-no-files-found: error

  # The publish jobs start together after every build, so one approval covers all of them.

  npm:
    needs: [version, typescript, python, java, dotnet]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11.5 or later (trusted publishing)
        run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
      - name: Publish the checked tarball
        env:
          FILE: medisync-${{ needs.version.outputs.version }}.tgz
          TAG: ${{ needs.version.outputs.npm_tag }}
        run: |
          if [ "$PUBLISH" = true ]; then
            npm publish "./$FILE" --provenance --access public --tag "$TAG"
          else
            npm publish "./$FILE" --access public --tag "$TAG" --dry-run
          fi

  jsr:
    needs: [version, typescript, python, java, dotnet]
    runs-on: ubuntu-latest
    environment: jsr
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to JSR (OIDC)
        run: |
          if [ "$PUBLISH" = true ]; then npx --yes jsr publish; else npx --yes jsr publish --dry-run; fi

  pypi:
    needs: [version, typescript, python, java, dotnet]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Rehearsal (the files passed twine check in the build)
        if: env.PUBLISH != 'true'
        run: ls -l dist/
      - name: Publish the checked files (trusted publishing, with attestations)
        if: env.PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  maven:
    needs: [version, typescript, python, java, dotnet]
    runs-on: ubuntu-latest
    environment: maven-central
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build and sign the bundle once (tests ran in the java job on this commit)
        env:
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -n "$MAVEN_GPG_KEY" || { echo "GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          ./mvnw -B -ntp -P release -DskipTests -DskipUpload=true deploy
          test -f target/central-publishing/central-bundle.zip
      - uses: ./.github/actions/leak-check
        with:
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          files: java/target/central-publishing/central-bundle.zip java/target/medisync-${{ needs.version.outputs.version }}.jar
      - name: Upload the checked bundle to the Central Portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "MAVEN_CENTRAL_USERNAME or MAVEN_CENTRAL_PASSWORD is not set" >&2
            exit 1
          fi
          api=https://central.sonatype.com/api/v1/publisher
          auth="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          # A rehearsal uploads for validation only and drops the deployment afterwards.
          if [ "$PUBLISH" = true ]; then type=AUTOMATIC; done_state=PUBLISHED; else type=USER_MANAGED; done_state=VALIDATED; fi
          id="$(curl --fail-with-body -sS -X POST -H "$auth" \
            -F "bundle=@target/central-publishing/central-bundle.zip" \
            "$api/upload?name=medisync-java-$VERSION&publishingType=$type")"
          echo "Deployment $id"
          for _ in $(seq 1 90); do
            state="$(curl --fail-with-body -sS -X POST -H "$auth" "$api/status?id=$id" | jq -r .deploymentState)"
            echo "State: $state"
            case "$state" in
              "$done_state")
                if [ "$PUBLISH" != true ]; then
                  curl --fail-with-body -sS -X DELETE -H "$auth" "$api/deployment/$id"
                  echo "Validated and dropped."
                fi
                exit 0 ;;
              FAILED) curl -sS -X POST -H "$auth" "$api/status?id=$id" | jq .errors >&2; exit 1 ;;
            esac
            sleep 20
          done
          echo "The deployment did not reach $done_state within 30 minutes. Check it on central.sonatype.com." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: maven-jars
          path: |
            java/target/medisync-${{ needs.version.outputs.version }}.jar
            java/target/medisync-${{ needs.version.outputs.version }}-sources.jar
            java/target/medisync-${{ needs.version.outputs.version }}-javadoc.jar
          if-no-files-found: error

  nuget:
    needs: [version, typescript, python, java, dotnet]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages
      - name: NuGet trusted publishing (a short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the checked packages
        if: env.PUBLISH == 'true'
        # The push of the .nupkg also sends the .snupkg next to it to the symbol server.
        run: dotnet nuget push "packages/MediSync.${{ needs.version.outputs.version }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  github-release:
    if: github.event_name == 'push'
    needs: [version, npm, jsr, pypi, maven, nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: GitHub release with the published files
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flag=""; [ "$PRERELEASE" = true ] && flag="--prerelease"
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" files/* -R "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $flag
