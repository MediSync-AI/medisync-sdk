# One release of every package from one tag v<version>: TypeScript to npm and JSR, Python to
# PyPI, Java to Maven Central, .NET to NuGet, then a GitHub release with the files.
#
# Release:
#   1. bun scripts/version.ts set 0.2.0, then a pull request into dev.
#   2. After the merge: git tag v0.2.0 <merge commit> && git push origin v0.2.0 (admins only).
#   3. In the run, click "Review deployments", select every environment, approve once.
#
# Rehearsal: Actions > Release > Run workflow on dev, tag empty. It runs every check and build,
# then every publish job without publishing: npm and JSR with --dry-run, the PyPI files checked, a
# Maven Central upload that is validated and then dropped, and the NuGet trusted-publishing login
# without a push.
#
# Finish an interrupted release: Run workflow on dev with the tag (v0.2.0). It builds and tests the
# tag again and publishes only to the registries that do not have the version yet.
#
# Each package is built and checked once. Then each built file is installed into a clean project,
# the way a user gets it from the registry, and runs against the API mock (release/install-test).
# The publish jobs start only after every install test passed, and send exactly the tested files:
# the Maven job signs the tested jars and POM itself and builds nothing again.
#
# Registries trust this file by name (npm, PyPI, NuGet) and by environment: do not rename it or
# the environments.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Finish the release of this tag (v0.2.0). Empty: a rehearsal that publishes nothing.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.0
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # The tag of this release: the pushed tag, or the tag a manual run finishes. Empty: a rehearsal.
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      python: ${{ steps.v.outputs.python }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: One version in every package, equal to the tag
        id: v
        run: |
          bun scripts/version.ts --github >> "$GITHUB_OUTPUT"
          version="$(bun scripts/version.ts)"
          if [ "$PUBLISH" = true ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG, packages $version: push the tag v$version." >&2
            exit 1
          fi
          echo "Version $version (publish: $PUBLISH)"
      - run: bun install --frozen-lockfile
      - name: Specs match SOURCE.json, generated code is up to date
        run: bun run specs:check && bun run generate:check
      - name: Contract and name list of MediSync Connect (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: MediSync-AI/medisync-connect
          ref: dev
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          path: .connect-ref
          fetch-depth: 1
          sparse-checkout: |
            /api/openapi.yaml
            /release/public-names.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Leak check of the repository (JSR publishes the sources)
        env:
          CONNECT_REPO: ${{ github.workspace }}/.connect-ref
          CONNECT_REF: HEAD
        run: bun release/leak-check.ts --repo

  typescript:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - run: npm run lint
      - name: Unit and parity tests
        run: npm test
      - name: Conformance
        run: npm run conformance
      - run: npm run build
      - run: npm run check:package
      - name: Pack once
        run: mkdir -p ../out && npm pack --pack-destination ../out
      - name: JSR accepts the package
        run: npx --yes jsr publish --dry-run
      - uses: ./.github/actions/leak-check
        with:
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          files: out/medisync-${{ needs.version.outputs.version }}.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: out/medisync-${{ needs.version.outputs.version }}.tgz
          if-no-files-found: error

  python:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Unit, parity and conformance tests on Python 3.9 and 3.13
        run: |
          for py in 3.9 3.13; do
            uv run --python "$py" --isolated --no-dev --with pytest --with pytest-asyncio --with cryptography pytest -q
          done
      - name: Lint and types
        run: |
          uv sync --python 3.13 --locked
          uv run ruff check src tests
          uv run mypy
          uv run pyright
      - name: Build once
        run: uv build --out-dir ../dist
      - run: python3 scripts/check_dist.py ../dist
      - name: PyPI accepts the metadata
        run: uvx twine check --strict ../dist/*
      - uses: ./.github/actions/leak-check
        with:
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          files: dist/medisync-${{ needs.version.outputs.python }}-py3-none-any.whl dist/medisync-${{ needs.version.outputs.python }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  java:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '21']
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Compile with -Werror, javadoc lint, unit, parity and conformance tests, jars
        run: ./mvnw -B -ntp verify
      - name: The files for the install test and the Maven Central bundle
        if: matrix.java == '21'
        run: cp pom.xml target/pom.xml
      - uses: actions/upload-artifact@v4
        if: matrix.java == '21'
        with:
          name: maven-files
          path: |
            java/target/medisync-${{ needs.version.outputs.version }}.jar
            java/target/medisync-${{ needs.version.outputs.version }}-sources.jar
            java/target/medisync-${{ needs.version.outputs.version }}-javadoc.jar
            java/target/pom.xml
          if-no-files-found: error

  dotnet:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build with warnings as errors, unit, parity and conformance tests
        run: dotnet test tests/MediSync.Tests -c Release
      - name: Pack once
        run: dotnet pack src/MediSync -c Release -o ../dist/dotnet
      - uses: ./.github/actions/leak-check
        with:
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          files: dist/dotnet/MediSync.${{ needs.version.outputs.version }}.nupkg dist/dotnet/MediSync.${{ needs.version.outputs.version }}.snupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            dist/dotnet/MediSync.${{ needs.version.outputs.version }}.nupkg
            dist/dotnet/MediSync.${{ needs.version.outputs.version }}.snupkg
          if-no-files-found: error

  # Install tests: each built file in a clean project, as a user installs it.

  install-typescript:
    needs: [version, typescript]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: denoland/setup-deno@v2
        if: matrix.node == 22
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: built
      - name: Node ${{ matrix.node }} (ESM, CommonJS, tsc --strict), Bun, and Deno on Node 22
        run: release/install-test/typescript/run.sh built/medisync-${{ needs.version.outputs.version }}.tgz ${{ needs.version.outputs.version }}

  install-python:
    needs: [version, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: built
      - name: The wheel on Python 3.9 and 3.13, the sdist on 3.13
        run: release/install-test/python/run.sh built ${{ needs.version.outputs.python }}

  install-java:
    needs: [version, java]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: maven-files
          path: built
      - name: A clean Maven project on Java ${{ matrix.java }}
        run: release/install-test/java/run.sh built ${{ needs.version.outputs.version }}

  install-dotnet:
    needs: [version, dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: built
      - name: A net8.0 app and a netstandard2.0 library
        run: release/install-test/dotnet/run.sh built ${{ needs.version.outputs.version }}

  # The publish jobs start together after every install test, so one approval covers all of them.

  npm:
    needs: [version, install-typescript, install-python, install-java, install-dotnet]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11.5 or later (trusted publishing)
        run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
      - name: Publish the checked tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NPM_TAG: ${{ needs.version.outputs.npm_tag }}
        run: |
          file="./medisync-$VERSION.tgz"
          if [ "$PUBLISH" != true ]; then
            npm publish "$file" --access public --tag "$NPM_TAG" --dry-run
          elif npm view "medisync@$VERSION" version >/dev/null 2>&1; then
            echo "medisync@$VERSION is on npm already."
          else
            npm publish "$file" --provenance --access public --tag "$NPM_TAG"
          fi

  jsr:
    needs: [version, install-typescript, install-python, install-java, install-dotnet]
    runs-on: ubuntu-latest
    environment: jsr
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to JSR (OIDC)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$PUBLISH" != true ]; then
            npx --yes jsr publish --dry-run
          elif curl -sf "https://api.jsr.io/scopes/medisync/packages/medisync/versions/$VERSION" >/dev/null; then
            echo "@medisync/medisync@$VERSION is on JSR already."
          else
            npx --yes jsr publish
          fi

  pypi:
    needs: [version, install-typescript, install-python, install-java, install-dotnet]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Rehearsal (the files passed twine check in the build), or on PyPI already
        id: done
        env:
          PY_VERSION: ${{ needs.version.outputs.python }}
        run: |
          ls -l dist/
          if [ "$PUBLISH" != true ]; then echo skip=true >> "$GITHUB_OUTPUT"; fi
          if [ "$PUBLISH" = true ] && curl -sf "https://pypi.org/pypi/medisync/$PY_VERSION/json" >/dev/null; then
            echo "medisync $PY_VERSION is on PyPI already."
            echo skip=true >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the checked files (trusted publishing, with attestations)
        if: steps.done.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  maven:
    needs: [version, install-typescript, install-python, install-java, install-dotnet]
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: maven-files
          path: tested
      - name: Sign the tested files and build the Central bundle from them
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || { echo "GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          dir="bundle/me/medisync/medisync/$VERSION"
          mkdir -p "$dir"
          for f in "medisync-$VERSION.jar" "medisync-$VERSION-sources.jar" "medisync-$VERSION-javadoc.jar"; do cp "tested/$f" "$dir/"; done
          cp tested/pom.xml "$dir/medisync-$VERSION.pom"
          for f in "$dir"/*; do
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign "$f"
            gpg --batch --quiet --verify "$f.asc" "$f"
            md5sum "$f" | cut -d' ' -f1 > "$f.md5"
            sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
            sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
            sha512sum "$f" | cut -d' ' -f1 > "$f.sha512"
          done
          (cd bundle && zip -q -r -X ../central-bundle.zip me)
          python3 -I -m zipfile -l central-bundle.zip
      - uses: ./.github/actions/leak-check
        with:
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          files: central-bundle.zip
      - name: Upload the bundle to the Central Portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "MAVEN_CENTRAL_USERNAME or MAVEN_CENTRAL_PASSWORD is not set" >&2
            exit 1
          fi
          api=https://central.sonatype.com/api/v1/publisher
          auth="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          if [ "$PUBLISH" = true ] && [ "$(curl --fail-with-body -sS -H "$auth" "$api/published?namespace=me.medisync&name=medisync&version=$VERSION" | jq -r .published)" = true ]; then
            echo "me.medisync:medisync:$VERSION is on Maven Central already."
            exit 0
          fi
          # A rehearsal uploads for validation only and drops the deployment afterwards.
          if [ "$PUBLISH" = true ]; then type=AUTOMATIC; done_state=PUBLISHED; else type=USER_MANAGED; done_state=VALIDATED; fi
          id="$(curl --fail-with-body -sS -X POST -H "$auth" \
            -F "bundle=@central-bundle.zip" \
            "$api/upload?name=medisync-java-$VERSION&publishingType=$type")"
          echo "Deployment $id"
          for _ in $(seq 1 90); do
            state="$(curl --fail-with-body -sS -X POST -H "$auth" "$api/status?id=$id" | jq -r .deploymentState)"
            echo "State: $state"
            case "$state" in
              "$done_state")
                if [ "$PUBLISH" != true ]; then
                  curl --fail-with-body -sS -X DELETE -H "$auth" "$api/deployment/$id"
                  echo "Validated and dropped."
                fi
                exit 0 ;;
              FAILED) curl -sS -X POST -H "$auth" "$api/status?id=$id" | jq .errors >&2; exit 1 ;;
            esac
            sleep 20
          done
          echo "The deployment did not reach $done_state within 30 minutes. Check it on central.sonatype.com." >&2
          exit 1

  nuget:
    needs: [version, install-typescript, install-python, install-java, install-dotnet]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages
      - name: NuGet trusted publishing (a short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the checked packages
        if: env.PUBLISH == 'true'
        # The push of the .nupkg also sends the .snupkg next to it to the symbol server.
        # --skip-duplicate: a finished release run again publishes nothing twice.
        run: dotnet nuget push "packages/MediSync.${{ needs.version.outputs.version }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: [version, npm, jsr, pypi, maven, nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: GitHub release with the published files
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The GitHub release $TAG exists already."
            exit 0
          fi
          flag=""; [ "$PRERELEASE" = true ] && flag="--prerelease"
          # shellcheck disable=SC2086
          gh release create "$TAG" files/* -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes $flag
