# Publishes the Python package for a tag python-v<version>: first every check, then one build,
# uploaded to TestPyPI and then to PyPI with trusted publishing and attestations.
#
# The leak check reads the Connect contract and the name list at release time through the
# read-only deploy key CONNECT_DEPLOY_KEY (a secret). Neither file is stored in this repository.
name: Release Python

on:
  push:
    tags: ['python-v*']

permissions:
  contents: read

concurrency:
  group: release-python
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Unit, parity and conformance tests
        run: uv run --python ${{ matrix.python }} --isolated --no-dev --with pytest --with pytest-asyncio --with cryptography pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: The tag equals the package version
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          code="$(grep -m1 '__version__' src/medisync/_version.py | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME#python-v}"
          if [ "$tag" != "$version" ] || [ "$code" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME, pyproject $version, _version.py $code: they must agree." >&2
            exit 1
          fi
      - name: Generated code is up to date
        working-directory: .
        run: bun install --frozen-lockfile && bun run generate:check
      - name: Lint and types
        run: |
          uv sync --python 3.13 --locked
          uv run ruff check src tests
          uv run mypy
          uv run pyright
      - name: Build once
        run: uv build --out-dir ../dist
      - run: python3 scripts/check_dist.py ../dist
      - name: Contract and name list of MediSync Connect (read-only deploy key, never stored in this repo)
        uses: actions/checkout@v4
        with:
          repository: MediSync-AI/medisync-connect
          ref: dev
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          path: .connect-ref
          fetch-depth: 1
          sparse-checkout: |
            /api/openapi.yaml
            /release/public-names.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Leak check
        working-directory: .
        env:
          CONNECT_REPO: ${{ github.workspace }}/.connect-ref
          CONNECT_REF: HEAD
        run: |
          bun release/leak-check.ts dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
