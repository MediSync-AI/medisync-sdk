# Publishes the Java package for a tag java-v<version>: first every check on Java 11 and 21, then
# one signed bundle, a leak check of that bundle, and its upload to the Central Portal, which
# releases it after validation.
#
# The leak check reads the Connect contract and the name list at release time through the
# read-only deploy key CONNECT_DEPLOY_KEY (a secret). Neither file is stored in this repository.
# Secrets of the environment maven-central: GPG_PRIVATE_KEY (armored secret key), GPG_PASSPHRASE,
# MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD (a user token of central.sonatype.com).
name: Release Java

on:
  push:
    tags: ['java-v*']

permissions:
  contents: read

concurrency:
  group: release-java
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.0

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '21']
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: The tag equals the package version
        run: |
          version="$(./mvnw -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          code="$(grep -m1 'VERSION = ' src/main/java/me/medisync/Version.java | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME#java-v}"
          if [ -z "$version" ] || [ "$tag" != "$version" ] || [ "$code" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME, pom.xml $version, Version.java $code: they must agree." >&2
            exit 1
          fi
      - name: Generated code is up to date
        if: matrix.java == '21'
        working-directory: .
        run: bun install --frozen-lockfile && bun run generate:check
      - name: Compile with -Werror, javadoc lint, unit, parity and conformance tests, jars
        run: ./mvnw -B -ntp verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: maven-central
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build and sign the bundle once, without an upload
        env:
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          test -n "$MAVEN_GPG_KEY" || { echo "GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          ./mvnw -B -ntp -P release -DskipTests -DskipUpload=true deploy
          test -f target/central-publishing/central-bundle.zip
      - name: Contract and name list of MediSync Connect (read-only deploy key, never stored in this repo)
        uses: actions/checkout@v4
        with:
          repository: MediSync-AI/medisync-connect
          ref: dev
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          path: .connect-ref
          fetch-depth: 1
          sparse-checkout: |
            /api/openapi.yaml
            /release/public-names.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Leak check of the bundle
        working-directory: .
        env:
          CONNECT_REPO: ${{ github.workspace }}/.connect-ref
          CONNECT_REF: HEAD
        run: |
          bun install --frozen-lockfile
          bun release/leak-check.ts java/target/central-publishing/central-bundle.zip java/target/medisync-*.jar
      - name: Upload the checked bundle to the Central Portal (automatic release)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "MAVEN_CENTRAL_USERNAME or MAVEN_CENTRAL_PASSWORD is not set" >&2
            exit 1
          fi
          auth="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          id="$(curl --fail-with-body -sS -X POST -H "$auth" \
            -F "bundle=@target/central-publishing/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=medisync-java-${GITHUB_REF_NAME#java-v}&publishingType=AUTOMATIC")"
          echo "Deployment $id"
          # Validation, then publishing, takes some minutes.
          for _ in $(seq 1 90); do
            state="$(curl --fail-with-body -sS -X POST -H "$auth" "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq -r .deploymentState)"
            echo "State: $state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) curl -sS -X POST -H "$auth" "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq .errors >&2; exit 1 ;;
            esac
            sleep 20
          done
          echo "The deployment did not reach PUBLISHED within 30 minutes. Check it on central.sonatype.com." >&2
          exit 1
