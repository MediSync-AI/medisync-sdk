# Publishes the .NET package for a tag dotnet-v<version>: first every check, then one pack, a
# leak check of the .nupkg and .snupkg, and the push of exactly these files to NuGet with
# trusted publishing (OIDC, no stored API key).
#
# The leak check reads the Connect contract and the name list at release time through the
# read-only deploy key CONNECT_DEPLOY_KEY (a secret). Neither file is stored in this repository.
# Repository variable NUGET_USER: the NuGet account that owns the package (the organisation owner).
# The trusted publishing policy on nuget.org names this repository, this workflow and the
# environment nuget.
name: Release .NET

on:
  push:
    tags: ['dotnet-v*']

permissions:
  contents: read

concurrency:
  group: release-dotnet
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.0
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: The tag equals the package version
        id: version
        run: |
          version="$(grep -m1 -o '<Version>[^<]*</Version>' src/MediSync/MediSync.csproj | sed 's/<[^>]*>//g')"
          code="$(grep -m1 'const string Value = ' src/MediSync/MediSyncClient.cs | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME#dotnet-v}"
          if [ -z "$version" ] || [ "$tag" != "$version" ] || [ "$code" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME, MediSync.csproj $version, SdkVersion $code: they must agree." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generated code is up to date
        working-directory: .
        run: bun install --frozen-lockfile && bun run generate:check
      - name: Build with warnings as errors, unit, parity and conformance tests
        run: dotnet test tests/MediSync.Tests -c Release
      - name: Pack once
        run: dotnet pack src/MediSync -c Release -o ../dist/dotnet
      - name: Contract and name list of MediSync Connect (read-only deploy key, never stored in this repo)
        uses: actions/checkout@v4
        with:
          repository: MediSync-AI/medisync-connect
          ref: dev
          ssh-key: ${{ secrets.CONNECT_DEPLOY_KEY }}
          path: .connect-ref
          fetch-depth: 1
          sparse-checkout: |
            /api/openapi.yaml
            /release/public-names.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Leak check
        working-directory: .
        env:
          CONNECT_REPO: ${{ github.workspace }}/.connect-ref
          CONNECT_REF: HEAD
        run: |
          bun release/leak-check.ts dist/dotnet/MediSync.${{ steps.version.outputs.version }}.nupkg dist/dotnet/MediSync.${{ steps.version.outputs.version }}.snupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            dist/dotnet/MediSync.${{ steps.version.outputs.version }}.nupkg
            dist/dotnet/MediSync.${{ steps.version.outputs.version }}.snupkg
          if-no-files-found: error

  nuget:
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages
      - name: NuGet trusted publishing (a short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the checked packages
        # The push of the .nupkg also sends the .snupkg next to it to the symbol server.
        run: dotnet nuget push "packages/MediSync.${{ needs.verify.outputs.version }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
